<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePop Distributed System Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #f1f5f9;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .diagram-panel {
            width: 40%;
            padding: 30px;
            background: #111827;
            border-right: 1px solid #374151;
            overflow-y: auto;
        }

        .demo-panel {
            width: 60%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            overflow-y: auto;
        }

        h1 {
            color: #f1f5f9;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: #6ee7b7;
        }

        .status-text {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Info Bar */
        .info-bar {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .info-bar-icon {
            display: inline-block;
            margin-right: 8px;
        }

        /* SVG Diagram */
        svg {
            width: 100%;
            max-width: 400px;
        }

        .node {
            stroke-width: 2;
            transition: all 0.3s;
        }

        .node-hub {
            fill: #1e3a5f;
            stroke: #3b82f6;
        }

        .node-store {
            fill: #064e3b;
            stroke: #10b981;
        }

        .node-active {
            filter: drop-shadow(0 0 15px currentColor);
        }

        .node-label {
            text-anchor: middle;
            font-size: 12px;
            fill: #f1f5f9;
            pointer-events: none;
            font-weight: 500;
        }

        .node-ip {
            text-anchor: middle;
            font-size: 9px;
            fill: #94a3b8;
            pointer-events: none;
        }

        .connection {
            stroke: #374151;
            stroke-width: 1.5;
            fill: none;
        }

        .legend {
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Right Panel */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
        }

        .reset-btn {
            background: #3b82f6;
            color: #f1f5f9;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: #2563eb;
        }

        .reset-btn:active {
            background: #1d4ed8;
        }

        .steps-container {
            flex: 1;
            overflow-y: auto;
        }

        /* Step Card */
        .step {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .step:hover {
            border-color: #4b5563;
        }

        .step.active {
            border-color: #3b82f6;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
        }

        .step-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .step-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #3b82f6;
            color: #f1f5f9;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }

        .step-meta {
            flex: 1;
        }

        .step-title {
            color: #f1f5f9;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .step-description {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }

        .step-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .run-btn {
            background: #3b82f6;
            color: #f1f5f9;
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .run-btn:hover {
            background: #2563eb;
        }

        .run-btn:active {
            background: #1d4ed8;
        }

        .run-btn:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }

        .curl-toggle {
            background: transparent;
            color: #94a3b8;
            padding: 6px 12px;
            border: 1px solid #374151;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .curl-toggle:hover {
            border-color: #4b5563;
            color: #cbd5e1;
        }

        .curl-block {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #cbd5e1;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            letter-spacing: 0.3px;
        }

        .curl-block.show {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .curl-line {
            word-break: break-word;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .response-panel {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 14px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #cbd5e1;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.8;
            letter-spacing: 0.3px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response-panel.error {
            color: #fca5a5;
        }

        /* JSON Syntax Highlighting */
        .json-key {
            color: #60a5fa;
            font-weight: 500;
        }

        .json-string {
            color: #34d399;
        }

        .json-number {
            color: #fbbf24;
        }

        .json-boolean {
            color: #a78bfa;
        }

        .json-null {
            color: #9ca3af;
            font-style: italic;
        }

        .json-brace,
        .json-bracket {
            color: #e5e7eb;
            font-weight: bold;
        }

        .json-colon {
            color: #cbd5e1;
        }

        .json-comma {
            color: #cbd5e1;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Architecture Diagram -->
        <div class="diagram-panel">
            <h1>CodePop Network</h1>
            <p class="subtitle">Distributed System Architecture</p>

            <div id="statusContainer" class="status-text">
                <span class="status-indicator"></span>
                <span id="statusText">Waiting for health check...</span>
            </div>

            <svg viewBox="0 0 400 500">
                <!-- Hub mesh: Logan Hub and Atlanta Hub (top row, peers) -->
                <circle id="logan-hub" class="node node-hub" cx="120" cy="80" r="30"/>
                <text class="node-label" x="120" y="83">Logan Hub</text>
                <text class="node-ip" x="120" y="98">34.136.12.86</text>

                <circle id="atlanta-hub" class="node node-hub" cx="280" cy="80" r="30"/>
                <text class="node-label" x="280" y="83">Atlanta Hub</text>
                <text class="node-ip" x="280" y="98">136.115.168.184</text>

                <!-- Stores (below respective hubs) -->
                <circle id="logan-s1" class="node node-store" cx="40" cy="280" r="25"/>
                <text class="node-label" x="40" y="283">Logan S1</text>
                <text class="node-ip" x="40" y="298">34.55.170.11</text>

                <circle id="logan-s2" class="node node-store" cx="120" cy="280" r="25"/>
                <text class="node-label" x="120" y="283">Logan S2</text>
                <text class="node-ip" x="120" y="298">34.121.91.135</text>

                <circle id="atlanta-s1" class="node node-store" cx="280" cy="280" r="25"/>
                <text class="node-label" x="280" y="283">Atlanta S1</text>
                <text class="node-ip" x="280" y="298">136.112.202.76</text>

                <circle id="atlanta-s2" class="node node-store" cx="360" cy="280" r="25"/>
                <text class="node-label" x="360" y="283">Atlanta S2</text>
                <text class="node-ip" x="360" y="298">34.173.157.74</text>

                <!-- Connections: hub-mesh (peer hubs), hub-to-stores -->
                <line class="connection" x1="150" y1="80" x2="250" y2="80"/>
                <line class="connection" x1="120" y1="110" x2="40" y2="255"/>
                <line class="connection" x1="120" y1="110" x2="120" y2="255"/>
                <line class="connection" x1="280" y1="110" x2="280" y2="255"/>
                <line class="connection" x1="280" y1="110" x2="360" y2="255"/>
            </svg>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background: #3b82f6;"></div>
                    <span>Hubs (mesh)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #10b981;"></div>
                    <span>Stores</span>
                </div>
            </div>
        </div>

        <!-- Right Panel: Demo Steps -->
        <div class="demo-panel">
            <div class="panel-header">
                <div>
                    <h1>Interactive Demo</h1>
                </div>
                <button class="reset-btn" onclick="resetDemo()">Reset All</button>
            </div>

            <div class="info-bar">
                <span class="info-bar-icon">⚡</span>
                <span><strong>Live Mode</strong> — requires <code>CORS_ALLOW_ALL_ORIGINS=True</code> on all GCP VMs</span>
            </div>

            <div class="steps-container" id="stepsContainer"></div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            nodes: {
                'logan-hub': 'http://34.136.12.86:8000',
                'atlanta-hub': 'http://136.115.168.184:8000',
                'logan-s1': 'http://34.55.170.11:8000',
                'logan-s2': 'http://34.121.91.135:8000',
                'atlanta-s1': 'http://136.112.202.76:8000',
                'atlanta-s2': 'http://34.173.157.74:8000'
            },
            nodeToken: '3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71',
            timeout: 5000
        };

        let testState = {
            aliceUserId: null,
            aliceToken: null,
            aliceS2UserId: null,
            aliceS2Token: null,
            bobUserId: null,
            bobToken: null
        };

        // Fetch with proper timeout using AbortController
        async function fetchWithTimeout(url, options = {}, ms = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), ms);
            try {
                const res = await fetch(url, { ...options, signal: controller.signal });
                return res;
            } finally {
                clearTimeout(id);
            }
        }

        // Demo Steps Definition (12 Phases from GCP Testing Guide)
        const demoSteps = [
            // Phase 1: Health Checks
            {
                id: 'health-checks',
                num: 1,
                title: 'Node Health Checks',
                description: 'Verify all 6 nodes are online and responding to authenticated requests.',
                curls: [
                    `curl -s -X POST http://34.136.12.86:8000/backend/internode/health-check/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`,
                    `curl -s -X POST http://34.55.170.11:8000/backend/internode/health-check/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`,
                    `curl -s -X POST http://34.121.91.135:8000/backend/internode/health-check/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`,
                    `curl -s -X POST http://136.115.168.184:8000/backend/internode/health-check/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`,
                    `curl -s -X POST http://136.112.202.76:8000/backend/internode/health-check/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`,
                    `curl -s -X POST http://34.173.157.74:8000/backend/internode/health-check/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`
                ],
                activeNodes: ['logan-hub', 'atlanta-hub', 'logan-s1', 'logan-s2', 'atlanta-s1', 'atlanta-s2'],
                action: async () => {
                    const results = [];
                    for (const [nodeId, url] of Object.entries(CONFIG.nodes)) {
                        try {
                            const response = await fetchWithTimeout(`${url}/backend/internode/health-check/`, {
                                method: 'POST',
                                headers: {'Authorization': `NodeToken ${CONFIG.nodeToken}`}
                            }, CONFIG.timeout);
                            if (response.ok) {
                                const data = await response.json();
                                results.push({ node: nodeId, status: data.status, online: true });
                            } else {
                                results.push({ node: nodeId, status: 'error', online: false });
                            }
                        } catch (err) {
                            results.push({ node: nodeId, status: 'offline', online: false, error: err.message });
                        }
                    }
                    return { health_checks: results, timestamp: new Date().toISOString() };
                }
            },
            // Phase 2: Store Auto-Registration
            {
                id: 'store-registry',
                num: 2,
                title: 'Store Auto-Registration',
                description: 'Verify stores have registered with their regional hub and appear in hub store lists.',
                curls: [
                    `curl -s http://34.136.12.86:8000/backend/hub/stores/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`,
                    `curl -s http://136.115.168.184:8000/backend/hub/stores/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`
                ],
                activeNodes: ['logan-hub', 'atlanta-hub'],
                action: async () => {
                    const results = {};
                    for (const hubName of ['logan-hub', 'atlanta-hub']) {
                        try {
                            const response = await fetchWithTimeout(`${CONFIG.nodes[hubName]}/backend/hub/stores/`, {
                                headers: {'Authorization': `NodeToken ${CONFIG.nodeToken}`}
                            }, CONFIG.timeout);
                            const data = await response.json();
                            results[hubName] = data;
                        } catch (err) {
                            throw new Error(`Failed to fetch stores from ${hubName}: ${err.message}`);
                        }
                    }
                    return { store_registries: results };
                }
            },
            // Phase 3: Register Alice at Logan Store 1
            {
                id: 'alice-register',
                num: 3,
                title: 'Register Alice at Logan Store 1',
                description: 'Alice registers with username, email, and password. Store 1 returns user_id and auth token.',
                curls: [
                    `curl -s -X POST http://34.55.170.11:8000/backend/auth/register/ \\
  -H "Content-Type: application/json" \\
  -d '{
    "username": "alice@codepop.local",
    "email": "alice@codepop.local",
    "password": "testpass123",
    "first_name": "Alice",
    "last_name": "Test"
  }'`
                ],
                activeNodes: ['logan-s1'],
                action: async () => {
                    try {
                        const response = await fetchWithTimeout(`${CONFIG.nodes['logan-s1']}/backend/auth/register/`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                username: 'alice@codepop.local',
                                email: 'alice@codepop.local',
                                password: 'testpass123',
                                first_name: 'Alice',
                                last_name: 'Test'
                            })
                        }, CONFIG.timeout);
                        const data = await response.json();
                        if (data.user_id) testState.aliceUserId = data.user_id;
                        if (data.token) testState.aliceToken = data.token;
                        return data;
                    } catch (err) {
                        throw new Error(`Registration failed: ${err.message}`);
                    }
                }
            },
            // Phase 4: Logan Hub Receives Alice
            {
                id: 'logan-hub-sync',
                num: '4',
                title: 'Logan Hub Receives Alice',
                description: 'Logan Hub checks if Alice exists in its UserCache (should find her synced from Store 1).',
                curls: [
                    `curl -s "http://34.136.12.86:8000/backend/hub/store-location/?email=alice@codepop.local" \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`
                ],
                activeNodes: ['logan-hub'],
                action: async () => {
                    if (!testState.aliceUserId) throw new Error('Run phase 3 first to register Alice.');
                    try {
                        const response = await fetchWithTimeout(
                            `${CONFIG.nodes['logan-hub']}/backend/hub/store-location/?email=alice@codepop.local`,
                            { headers: {'Authorization': `NodeToken ${CONFIG.nodeToken}`} },
                            CONFIG.timeout
                        );
                        return await response.json();
                    } catch (err) {
                        throw new Error(`Hub lookup failed: ${err.message}`);
                    }
                }
            },
            // Phase 4a: Logan Hub Has Alice (same as Phase 4)
            {
                id: 'logan-hub-alice',
                num: '4a',
                title: 'Logan Hub Has Alice',
                description: 'Logan Hub has Alice in UserCache (synced from Store 1 via Celery). No master hub.',
                curls: [
                    `curl -s "http://34.136.12.86:8000/backend/hub/store-location/?email=alice@codepop.local" \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`
                ],
                activeNodes: ['logan-hub'],
                action: async () => {
                    if (!testState.aliceUserId) throw new Error('Run phase 3 first to register Alice.');
                    try {
                        const response = await fetchWithTimeout(
                            `${CONFIG.nodes['logan-hub']}/backend/hub/store-location/?email=alice@codepop.local`,
                            { headers: {'Authorization': `NodeToken ${CONFIG.nodeToken}`} },
                            CONFIG.timeout
                        );
                        return await response.json();
                    } catch (err) {
                        throw new Error(`Logan hub lookup failed: ${err.message}`);
                    }
                }
            },
            // Phase 4b: Atlanta Hub Finds Alice via Hub-Mesh
            {
                id: 'atlanta-cascade',
                num: '4b',
                title: 'Atlanta Hub Finds Alice (Hub-Mesh)',
                description: 'Atlanta Hub doesn\'t have Alice locally; broadcasts to peer hubs via hub-mesh; Logan Hub responds.',
                curls: [
                    `curl -s "http://136.115.168.184:8000/backend/hub/store-location/?email=alice@codepop.local" \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71"`
                ],
                activeNodes: ['atlanta-hub', 'logan-hub'],
                action: async () => {
                    if (!testState.aliceUserId) throw new Error('Run phase 3 first to register Alice.');
                    try {
                        const response = await fetchWithTimeout(
                            `${CONFIG.nodes['atlanta-hub']}/backend/hub/store-location/?email=alice@codepop.local`,
                            { headers: {'Authorization': `NodeToken ${CONFIG.nodeToken}`} },
                            CONFIG.timeout
                        );
                        return await response.json();
                    } catch (err) {
                        throw new Error(`Cascade lookup failed: ${err.message}`);
                    }
                }
            },
            // Phase 5: Inter-Node User Lookup
            {
                id: 'internode-lookup',
                num: 5,
                title: 'Inter-Node User Lookup',
                description: 'Logan Store 2 looks up Alice (who is at Store 1) via inter-node protocol.',
                curls: [
                    `curl -s -X POST http://34.121.91.135:8000/backend/internode/user-lookup/ \\
  -H "Authorization: NodeToken 3597b3480971f2aa46484d2a8cad6aa55a979ba01292630d6f247d8224d76d71" \\
  -H "Content-Type: application/json" \\
  -d '{"email": "alice@codepop.local", "requesting_store_id": 2}'`
                ],
                activeNodes: ['logan-s2'],
                action: async () => {
                    if (!testState.aliceUserId) throw new Error('Run phase 3 first to register Alice.');
                    try {
                        const response = await fetchWithTimeout(
                            `${CONFIG.nodes['logan-s2']}/backend/internode/user-lookup/`,
                            {
                                method: 'POST',
                                headers: {
                                    'Authorization': `NodeToken ${CONFIG.nodeToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    email: 'alice@codepop.local',
                                    requesting_store_id: 2
                                })
                            },
                            CONFIG.timeout
                        );
                        return await response.json();
                    } catch (err) {
                        throw new Error(`Inter-node lookup failed: ${err.message}`);
                    }
                }
            },
            // Phase 6: Visiting User Login at Logan Store 2 (proxied credential verification)
            {
                id: 'visiting-login',
                num: 6,
                title: 'Visiting User Login at Store 2',
                description: 'Alice logs in at Store 2 using her real credentials. Store 2 proxies the password to Store 1 for verification, then issues a local token.',
                curls: [
                    `curl -s -X POST http://34.121.91.135:8000/backend/auth/login/ \\
  -H "Content-Type: application/json" \\
  -d '{"username": "alice@codepop.local", "password": "testpass123"}'`
                ],
                activeNodes: ['logan-s2'],
                action: async () => {
                    if (!testState.aliceUserId) throw new Error('Run phase 3 first to register Alice.');
                    try {

        // Render Steps UI
        function renderSteps() {
            const container = document.getElementById('stepsContainer');
            container.innerHTML = demoSteps.map((step) => `
                <div class="step" data-step="${step.id}">
                    <div class="step-header">
                        <span class="step-badge">${step.num}</span>
                        <div class="step-meta">
                            <div class="step-title">${step.title}</div>
                            <div class="step-description">${step.description}</div>
                        </div>
                    </div>
                    <div class="step-controls">
                        <button class="run-btn" onclick="runStep('${step.id}')">Run</button>
                        <button class="curl-toggle" onclick="toggleCurl('${step.id}')">curl ▾</button>
                    </div>
                    <div class="curl-block" id="curl-${step.id}">
                        ${step.curls.map(c => `<div class="curl-line">${escapeHtml(c)}</div>`).join('')}
                    </div>
                    <div class="response-panel" id="response-${step.id}">Waiting for request...</div>
                </div>
            `).join('');
        }

        function toggleCurl(stepId) {
            const elem = document.getElementById(`curl-${stepId}`);
            elem.classList.toggle('show');
        }

        async function runStep(stepId) {
            const step = demoSteps.find(s => s.id === stepId);
            const responseElem = document.getElementById(`response-${stepId}`);
            const stepElem = document.querySelector(`[data-step="${stepId}"]`);

            // Clear active nodes
            document.querySelectorAll('.node-active').forEach(n => n.classList.remove('node-active'));

            // Highlight active nodes
            step.activeNodes.forEach(nodeId => {
                const node = document.getElementById(nodeId);
                if (node) node.classList.add('node-active');
            });

            // Mark step as active
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            stepElem.classList.add('active');

            responseElem.textContent = 'Running...';
            responseElem.classList.remove('error');

            try {
                const response = await step.action();
                const jsonStr = JSON.stringify(response, null, 2);
                responseElem.innerHTML = syntaxHighlight(jsonStr);
                responseElem.classList.remove('error');
            } catch (err) {
                responseElem.innerHTML = `<span style="color: #fca5a5;">Error: ${escapeHtml(err.message)}</span>`;
                responseElem.classList.add('error');
            }
        }

        function resetDemo() {
            document.querySelectorAll('.node-active').forEach(n => n.classList.remove('node-active'));
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.response-panel').forEach(r => r.textContent = 'Waiting for request...');
            document.querySelectorAll('.curl-block').forEach(c => c.classList.remove('show'));
            testState = {
                aliceUserId: null,
                aliceToken: null,
                aliceS2UserId: null,
                aliceS2Token: null,
                bobUserId: null,
                bobToken: null,
                aliceAtlantaUserId: null,
                aliceAtlantaToken: null
            };
            updateStatus();
        }

        function syntaxHighlight(json) {
            // First escape HTML
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // Then apply syntax highlighting while preserving whitespace
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/^(true|false)$/.test(match)) {
                    cls = 'json-boolean';
                } else if (/^null$/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function updateStatus() {
            const statusDiv = document.getElementById('statusContainer');
            statusDiv.innerHTML = `<span class="status-indicator"></span><span id="statusText">Ready for requests</span>`;
        }

        // Initialize
        renderSteps();
        updateStatus();
