name: Deploy to GCP VMs

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to logan-master-hub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOGAN_HUB_IP }}
          username: peterson_braden2
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/codepop/codepop_backend
            git pull origin master
            docker-compose down
            docker-compose up -d --build

      - name: Deploy to logan-store-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOGAN_STORE1_IP }}
          username: peterson_braden2
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/codepop/codepop_backend
            git pull origin master
            docker-compose down
            docker-compose up -d --build

      - name: Deploy to logan-store-2
