name: Deploy to GCP VMs

on:
  push:
    branches: [ master ]

jobs:
  # ── CI: Tests must pass before any VM is touched ─────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: codepop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        options: --health-cmd "redis-cli ping"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd codepop_backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_NAME: codepop
          DB_USER: postgres
          DB_PASSWORD: password
          REDIS_URL: redis://localhost:6379/0
          INTER_NODE_SECRET: test-secret
          IS_HUB: 'False'
        run: |
          cd codepop_backend
          python manage.py migrate
          python manage.py test backend

  # ── Hub deployments ───────────────────────────────────────────────────────────
  deploy-logan-hub:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOGAN_HUB_IP }}
          username: peterson_braden2
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/codepop/codepop_backend

            # Update distributed system env vars (remove old values, append fresh ones)
            grep -v "^MY_API_ENDPOINT=\|^HUB_URL=\|^HUB_LOGAN_URL=\|^HUB_ATLANTA_URL=\|^IS_HUB=" .env > .env.tmp && mv .env.tmp .env || true
            echo "IS_HUB=True" >> .env
            echo "MY_API_ENDPOINT=http://$(hostname -I | awk '{print $1}'):8000" >> .env
            echo "HUB_URL=http://${{ secrets.LOGAN_HUB_IP }}:8000" >> .env
            echo "HUB_LOGAN_URL=http://${{ secrets.LOGAN_HUB_IP }}:8000" >> .env
            echo "HUB_ATLANTA_URL=http://${{ secrets.ATLANTA_HUB_IP }}:8000" >> .env

            git pull origin master
            docker compose down
            docker compose up -d --build
            docker compose run --rm web python manage.py migrate
            echo "✓ logan-hub deployed successfully"

  deploy-atlanta-hub:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
