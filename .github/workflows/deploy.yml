  # ── Completion gate ───────────────────────────────────────────────────────────
  deploy-complete:
    needs: [deploy-logan-hub, deploy-logan-store-1, deploy-logan-store-2, deploy-atlanta-hub, deploy-atlanta-store-1, deploy-atlanta-store-2]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✓ All deployments completed successfully"
            exit 0
          else
            echo "✗ One or more deployments failed"
            exit 1
          fi
