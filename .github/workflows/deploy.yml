        with:
          host: ${{ secrets.LOGAN_STORE2_IP }}
          username: peterson_braden2
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/codepop/codepop_backend
            git pull origin master
            docker-compose down
            docker-compose up -d --build

      - name: Deploy to atlanta-hub
